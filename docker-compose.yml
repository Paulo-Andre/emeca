services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - emeca_data:/data
      - /srv/backups/emeca:/backups
    networks:
      - default
      - emeca_private

  whatsapp-worker:
    build: .
    restart: unless-stopped
    depends_on:
      - web
    env_file:
      - .env
    environment:
      SKIP_DJANGO_INIT: "1"
    command: ["python", "manage.py", "processar_envios_whatsapp"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - emeca_data:/data
    networks:
      - default
      - emeca_private

volumes:
  emeca_data:

networks:
  emeca_private:
    name: emeca_private
