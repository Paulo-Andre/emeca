services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - emeca_data:/data

  whatsapp-worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "manage.py", "processar_envios_whatsapp"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - emeca_data:/data

volumes:
  emeca_data:
