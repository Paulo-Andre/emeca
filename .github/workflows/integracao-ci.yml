name: Integração EMECA

on:
  push:
    branches:
      - main
      - integracao-sistema-unificado
  pull_request:
    branches:
      - main

jobs:
  validar:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-django-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz"
      DOCUMENT_SIGNING_KEY: "ci-document-signing-key-0123456789-abcdefghijklmnopqrstuvwxyz"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,testserver"
      DJANGO_RBAC_STRICT: "0"
      DJANGO_RATE_LIMIT_ENABLED: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verificar segredos versionados
        run: python scripts/auditoria_segredos.py

      - name: Validar scripts da futura atualização única
        run: |
          bash -n deploy/atualizar_lote_seguro.sh
          bash -n deploy/instalar_cpfs_emeca.sh
          bash -n deploy/wa-akg/implantar_emeca.sh
          bash -n deploy/wa-akg/ativar_anexos_emeca.sh
          bash -n deploy/wa-akg/atualizar_diagnostico_midia.sh
          bash -n deploy/wa-akg/atualizar_baileys_rc14_seguro.sh
          bash -n deploy/wa-akg/recuperar_wa_akg_pos_upgrade.sh
          bash -n deploy/wa-akg/corrigir_upload_pdf_rc9.sh
          bash -n deploy/wa-akg/verificar_patch_upload_sem_build.sh
          bash -n deploy/wa-akg/verificar_transporte_https_rc9_sem_build.sh
          bash -n deploy/wa-akg/corrigir_transporte_https_rc9.sh
          python3 -m py_compile deploy/wa-akg/preparar_transporte_https_rc9.py
          node --check deploy/wa-akg/patch-baileys-rc9-https.cjs
          node --check deploy/wa-akg/patch-baileys-rc9-https.cjs
          python3 -m unittest discover -s deploy/wa-akg -p 'test_patch_https_rc9.py' -v
          python3 -m py_compile deploy/wa-akg/preparar_fix_upload_rc9.py
          node --check deploy/wa-akg/patch-baileys-rc9.cjs
          python3 -m unittest discover -s deploy/wa-akg -p 'test_patch_upload_rc9.py' -v
          python3 -m py_compile deploy/wa-akg/aplicar_correcoes.py
          python3 -m unittest discover -s deploy/wa-akg -p 'test_*.py' -v
          python3 -m unittest discover -s scripts -p 'test_patcher_scheduler.py' -v
          python3 -m unittest discover -s scripts -p 'test_validacao_backups_lote.py' -v

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Auditar dependências Python
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Instalar ferramenta de cobertura
        run: python -m pip install coverage

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend_publico/package-lock.json

      - name: Validar telemetria passiva HTTP sem rede externa
        run: node deploy/wa-akg/testar_http_passivo.cjs

      - name: Compilar e auditar área pública
        working-directory: frontend_publico
        run: |
          npm ci
          # Verifica sintaxe TypeScript do overlay WA-AKG sem precisar usar
          # credenciais/sessões reais e sem executar o agendador.
          npx --yes --package=esbuild@0.25.12 -- esbuild ../deploy/wa-akg/overrides/src/modules/whatsapp/scheduler.ts --outfile=/tmp/wa-akg-scheduler-qa.js --platform=node --format=esm
          npm audit --audit-level=high
          npm run lint
          npm run build

      - name: Verificar Django
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
          coverage run --source=cadastro,secretaria,usuarioSec,historico,site_publico --omit='*/migrations/*,*/test*.py,*/tests.py' manage.py test
          coverage report -m
          coverage xml -o coverage.xml

      - name: Publicar relatório de cobertura de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-emeca
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Smoke de carga com dados sintéticos
        run: |
          gunicorn App.wsgi:application --bind 127.0.0.1:8010 --workers 2 --timeout 30 --access-logfile /tmp/emeca-audit-access.log --daemon
          python scripts/auditoria_carga.py --base http://127.0.0.1:8010
          if grep -Eq 'ESTUDANTE SINTETICO|2017-01-01|Senha-Sintetica' /tmp/emeca-audit-access.log; then
            echo "Falha: corpo sintético/PII apareceu no access log."
            exit 1
          fi
          test ! -s /tmp/emeca-audit-access.log || tail -n 20 /tmp/emeca-audit-access.log

      - name: Verificação de produção
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECURE_COOKIES: "1"
          DJANGO_SECURE_SSL_REDIRECT: "1"
          DJANGO_HSTS_SECONDS: "31536000"
          DJANGO_CSRF_TRUSTED_ORIGINS: "https://testserver"
          DJANGO_REQUIRE_SECURE_PRODUCTION: "1"
        run: python manage.py check --deploy
