name: Corrigir lockfile temporariamente

on:
  push:
    branches:
      - security/hardening-pendencias

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/hardening-pendencias
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend_publico/package-lock.json
      - name: Sincronizar package-lock
        working-directory: frontend_publico
        run: npm install --package-lock-only
      - name: Gravar lockfile se necessário
        run: |
          if git diff --quiet -- frontend_publico/package-lock.json; then
            echo "Lockfile já está sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend_publico/package-lock.json
          git commit -m "Sincronizar package-lock"
          git push origin HEAD:security/hardening-pendencias
