name: Sincronizar lockfile da PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.head_ref == 'security/hardening-pendencias' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sincronizar e corrigir lockfile
        working-directory: frontend_publico
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only
      - name: Gravar lockfile
        run: |
          if git diff --quiet -- frontend_publico/package-lock.json; then
            echo "package-lock já está sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend_publico/package-lock.json
          git commit -m "Sincronizar package-lock e corrigir dependências auditáveis"
          git push origin HEAD:${{ github.head_ref }}
